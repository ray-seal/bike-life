<!-- Supabase JS CDN and Like Button Script -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
<script>
  // Replace with your Supabase info!
  const supabaseUrl = 'https://bdbdvbwnvhdvvymmrhus.supabase.co';
  const supabaseKey = 'sb_publishable_GWagUQzrBmaIakjjNA-7qg_glvd_YtI';
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  document.addEventListener('DOMContentLoaded', async () => {
    const images = document.querySelectorAll('.album-img');

    for (const imgDiv of images) {
      const imgId = imgDiv.getAttribute('data-img-id');
      const countSpan = imgDiv.querySelector('.like-count');
      const likeBtn = imgDiv.querySelector('.like-btn');

      // Fetch current like count
      let { data, error } = await supabase
        .from('image_likes')
        .select('likes')
        .eq('img_id', imgId)
        .single();
      countSpan.textContent = data ? data.likes : 0;

      likeBtn.addEventListener('click', async () => {
        // Fetch current likes
        let { data, error } = await supabase
          .from('image_likes')
          .select('likes')
          .eq('img_id', imgId)
          .single();
        let currentLikes = data ? data.likes : 0;

        // Upsert (insert or update) new like count
        let { data: updated, error: upsertError } = await supabase
          .from('image_likes')
          .upsert({ img_id: imgId, likes: currentLikes + 1 }, { onConflict: ['img_id'] })
          .select('likes')
          .single();

        countSpan.textContent = updated.likes;
      });
    }
  });
</script>
