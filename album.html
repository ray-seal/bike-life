<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Photo Album v9</title>
  <style>
    body { background: #111; color: #33ff33; font-family: monospace; }
    .album-img { padding: 10px; border: 1px solid #33ff33; margin: 10px; background: #222; border-radius: 8px; width: 250px; }
    .like-btn { margin-top: 5px; }
    .comment-section { margin-top: 10px; }
    .comment-list { max-height: 100px; overflow-y: auto; font-size: 0.95em; }
  </style>
</head>
<body>
  <div class="album-img" data-img-id="tt600.jpg">
    <img src="images/tt600.jpg" width="100%">
    <div>
      <button class="like-btn">👍 Like</button>
      <span class="like-count">0</span>
    </div>
    <div class="comment-section">
      <ul class="comment-list"></ul>
      <form class="comment-form">
        <input type="text" placeholder="Your name" required maxlength="32"><br>
        <textarea placeholder="Add a comment..." required maxlength="200"></textarea><br>
        <button type="submit">💬 Add Comment</button>
      </form>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const supabaseClient = supabase.createClient(
  'https://bdbdvbwnvhdvvymmrhus.supabase.co',
  'sb_publishable_GWagUQzrBmaIakjjNA-7qg_glvd_YtI'
);

const imgDiv = document.querySelector('.album-img');
const imgId = imgDiv.getAttribute('data-img-id');
const countSpan = imgDiv.querySelector('.like-count');
const likeBtn = imgDiv.querySelector('.like-btn');
const commentList = imgDiv.querySelector('.comment-list');
const commentForm = imgDiv.querySelector('.comment-form');
const nameInput = commentForm.querySelector('input[type="text"]');
const commentInput = commentForm.querySelector('textarea');

// Likes
async function fetchLikes() {
  let { data, error } = await supabaseClient
    .from('image_likes').select('likes').eq('img_id', imgId).maybeSingle();
  countSpan.textContent = data && data.likes ? data.likes : 0;
}
likeBtn.addEventListener('click', async () => {
  let { data, error } = await supabaseClient
    .from('image_likes').select('likes').eq('img_id', imgId).maybeSingle();
  if (!data) {
    let { error: insertErr } = await supabaseClient
      .from('image_likes').insert({ img_id: imgId, likes: 1 });
    if (insertErr) alert('Like insert error: ' + insertErr.message);
  } else {
    let { error: updateErr } = await supabaseClient
      .from('image_likes').update({ likes: data.likes + 1 }).eq('img_id', imgId);
    if (updateErr) alert('Like update error: ' + updateErr.message);
  }
  fetchLikes();
});

// Comments
async function fetchComments() {
  let { data, error } = await supabaseClient
    .from('image_comments')
    .select('name, comment, created_at')
    .eq('img_id', imgId)
    .order('created_at', { ascending: true });
  commentList.innerHTML = '';
  if (data && data.length) {
    data.forEach(c => {
      let li = document.createElement('li');
      li.textContent = `[${new Date(c.created_at).toLocaleString()}] ${c.comment} - ${c.name}`;
      commentList.appendChild(li);
    });
  } else {
    commentList.innerHTML = '<li style="color:#777">No comments yet.</li>';
  }
}
commentForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = nameInput.value.trim();
  const comment = commentInput.value.trim();
  if (!name || !comment) return;
  let { error } = await supabaseClient
    .from('image_comments').insert({ img_id: imgId, name, comment });
  if (error) alert('Comment error: ' + error.message);
  nameInput.value = '';
  commentInput.value = '';
  fetchComments();
});

fetchLikes();
fetchComments();
</script>
</body>
</html>
