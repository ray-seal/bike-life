<h1 class="hacker-box" style="text-align: center;">Bike Life Photo Album</h1>

<p>Below are some of the photos shared by group members of their beloved machines. Go ahead and give them a like, I'm sure they'll appreciate it.</p>

<div id="album-container">
  <div class="album-img" data-img-id="tt600.jpg">
    <img src="images/tt600.jpg" width="100%">
    <button class="like-btn">👍 Like</button>
    <span class="like-count">0</span>
    <div class="comment-section">
      <ul class="comment-list"></ul>
      <form class="comment-form">
        <input type="text" placeholder="Your name" required maxlength="32"><br>
        <textarea placeholder="Add a comment..." rows="2" required maxlength="200"></textarea><br>
        <button type="submit">💬 Add Comment</button>
      </form>
    </div>
  </div>
</div>

<br><br>
<hr>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const supabase = supabase.createClient(
  'https://bdbdvbwnvhdvvymmrhus.supabase.co',
  'sb_publishable_GWagUQzrBmaIakjjNA-7qg_glvd_YtI'
);

document.addEventListener('DOMContentLoaded', async () => {
  const imgDiv = document.querySelector('.album-img');
  const imgId = imgDiv.getAttribute('data-img-id');
  const countSpan = imgDiv.querySelector('.like-count');
  const likeBtn = imgDiv.querySelector('.like-btn');
  const commentList = imgDiv.querySelector('.comment-list');
  const commentForm = imgDiv.querySelector('.comment-form');
  const nameInput = commentForm.querySelector('input[type="text"]');
  const commentInput = commentForm.querySelector('textarea');

  // Likes
  async function fetchLikes() {
    let { data } = await supabase.from('image_likes').select('likes').eq('img_id', imgId).maybeSingle();
    countSpan.textContent = data && data.likes ? data.likes : 0;
  }
  likeBtn.addEventListener('click', async () => {
    let { data } = await supabase.from('image_likes').select('likes').eq('img_id', imgId).maybeSingle();
    if (!data) {
      await supabase.from('image_likes').insert({ img_id: imgId, likes: 1 });
    } else {
      await supabase.from('image_likes').update({ likes: data.likes + 1 }).eq('img_id', imgId);
    }
    fetchLikes();
  });

  // Comments
  async function fetchComments() {
    let { data } = await supabase.from('image_comments')
      .select('name, comment, created_at')
      .eq('img_id', imgId)
      .order('created_at', { ascending: true });
    commentList.innerHTML = '';
    if (data && data.length) {
      data.forEach(c => {
        let li = document.createElement('li');
        li.textContent = `[${new Date(c.created_at).toLocaleString()}] ${c.comment} - ${c.name}`;
        commentList.appendChild(li);
      });
    } else {
      commentList.innerHTML = '<li style="color:#777">No comments yet.</li>';
    }
  }
  commentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    const comment = commentInput.value.trim();
    if (!name || !comment) return;
    await supabase.from('image_comments').insert({ img_id: imgId, name, comment });
    nameInput.value = '';
    commentInput.value = '';
    fetchComments();
  });

  fetchLikes();
  fetchComments();
});
</script>
