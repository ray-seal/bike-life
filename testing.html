<!DOCTYPE html>
<html>
<head>
  <title>Bike Life Comments</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <form id="myForm">
    <label for="Name">Enter Name:</label>
    <input type="text" id="name" required><br><br>
    <label for="Bike">Enter Bike:</label>
    <input type="text" id="bike" required><br><br>
    <label for="Comments">Comments</label>
    <input type="text" id="comments" required><br><br>
    <input type="submit">
  </form>

  <div id="table">
    <h2>Comments</h2>
    <table id="dataTable">
      <tr>
        <th>Name</th>
        <th>Bike</th>
        <th>Comments</th>
      </tr>
    </table>
  </div>
  
  <script>
    // 1. Your actual Supabase project credentials
    const SUPABASE_URL = 'https://bdbdvbwnvhdvvymmrhus.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_GWagUQzrBmaIakjjNA-7qg_glvd_YtI';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function addRowToTable(Name, Bike, Comments) {
      const table = document.getElementById("dataTable");
      const row = table.insertRow(-1);
      row.insertCell(0).textContent = Name;
      row.insertCell(1).textContent = Bike;
      row.insertCell(2).textContent = Comments;
    }

    async function loadTableData() {
      const table = document.getElementById("dataTable");
      while (table.rows.length > 1) table.deleteRow(1);

      let { data, error } = await supabase
        .from('bike_life')
        .select('"Name", "Bike", "Comments"')
        .order('id', { ascending: true });

      if (error) {
        alert('Error loading data: ' + error.message);
        return;
      }

      if (data) {
        data.forEach(row => addRowToTable(row.Name, row.Bike, row.Comments));
      }
    }

    document.getElementById("myForm").addEventListener("submit", async function(event) {
      event.preventDefault();
      const Name = document.getElementById("name").value;
      const Bike = document.getElementById("bike").value;
      const Comments = document.getElementById("comments").value;

      const { data, error } = await supabase
        .from('bike_life')
        .insert([{ Name, Bike, Comments }]);

      if (error) {
        alert('Error saving data: ' + error.message);
        return;
      }

      document.getElementById("myForm").reset();
      await loadTableData();
    });

    window.onload = loadTableData;
  </script>
</body>
</html>
